name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: godot --headless --import

      - name: Run tests
        run: godot --headless -s res://tests/run_tests.gd

      - name: Export Windows, macOS and Linux
        run: |
          mkdir -p build/windows build/macos build/linux
          godot --headless --export-release "Windows" build/windows/Uzay.exe
          godot --headless --export-release "macOS" build/macos/Uzay.zip
          godot --headless --export-release "Linux" build/linux/Uzay.x86_64
          ls -lR build

      - uses: actions/upload-artifact@v4
        with:
          name: Uzay-Windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Uzay-macOS
          path: build/macos
      - uses: actions/upload-artifact@v4
        with:
          name: Uzay-Linux
          path: build/linux
